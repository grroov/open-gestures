<svg width="480" height="850" viewBox="0 0 480 850" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Dark Background -->
  <rect width="480" height="850" fill="#0f0d13"/>

  <defs>
    <!-- Header Gradient matching options page dark mode -->
    <linearGradient id="headerGrad" x1="120" y1="52" x2="360" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cf699b"/>
      <stop offset="100%" stop-color="#9c83c2"/>
    </linearGradient>
    
    <!-- Outer Glow for the Container -->
    <filter id="containerGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Options Container Panel -->
  <rect x="20" y="20" width="440" height="810" rx="28" fill="#141218" stroke="#2b2930" stroke-width="1.5" filter="url(#containerGlow)"/>

  <!-- Header -->
  <g transform="translate(0, 0)">
    <text x="240" y="68" font-family="Outfit, Inter, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="url(#headerGrad)" text-anchor="middle" letter-spacing="-0.5">Open Gestures</text>
    <text x="240" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#938f99" text-anchor="middle" font-weight="400">Customize your browser gesture preferences</text>
  </g>

  <!-- 1. Mouse Button Trigger Card -->
  <g transform="translate(40, 115)">
    <rect width="400" height="130" rx="20" fill="#211f26" stroke="#79747e" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="28" font-family="Outfit, Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e1e5">Mouse Button Trigger</text>
    
    <!-- Button Group Track -->
    <rect x="20" y="44" width="360" height="36" rx="12" fill="#1c1b1f"/>
    <!-- Right Active Selector background pill -->
    <rect x="238" y="46" width="140" height="32" rx="10" fill="#351c33"/>
    
    <text x="80" y="66" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#938f99" text-anchor="middle" font-weight="500">Left</text>
    <text x="180" y="66" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#938f99" text-anchor="middle" font-weight="500">Middle</text>
    <text x="308" y="66" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#cf699b" text-anchor="middle">Right</text>
    
    <text x="20" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#938f99" fill-opacity="0.85">Choose which mouse button activates gestures (Left, Middle, or Right).</text>
  </g>

  <!-- 2. Trail Color Card -->
  <g transform="translate(40, 260)">
    <rect width="400" height="120" rx="20" fill="#211f26" stroke="#79747e" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="28" font-family="Outfit, Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e1e5">Trail Color</text>
    
    <!-- Color Swatch Circle -->
    <circle cx="34" cy="52" r="14" fill="#cf699b"/>
    <!-- Input Hex Box -->
    <rect x="60" y="38" width="320" height="28" rx="8" fill="#1c1b1f"/>
    <text x="72" y="56" font-family="Inter, monospace" font-size="12.5" fill="#cf699b" font-weight="500">#cf699b</text>
    
    <text x="20" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#938f99" fill-opacity="0.85">Choose the visual color of the gesture trail and start dot.</text>
  </g>

  <!-- 3. Mouse Trail Card -->
  <g transform="translate(40, 395)">
    <rect width="400" height="95" rx="20" fill="#211f26" stroke="#79747e" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="33" font-family="Outfit, Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e1e5">Mouse Trail</text>
    
    <!-- Switch ON -->
    <rect x="336" y="16" width="44" height="24" rx="12" fill="#cf699b"/>
    <circle cx="368" cy="28" r="9" fill="white"/>
    
    <text x="20" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#938f99" fill-opacity="0.85">Show or hide the visual trail lines drawn as you drag.</text>
  </g>

  <!-- 4. Key-Press Disable Card -->
  <g transform="translate(40, 505)">
    <rect width="400" height="95" rx="20" fill="#211f26" stroke="#79747e" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="33" font-family="Outfit, Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e1e5">Key-Press Disable</text>
    
    <!-- Switch ON -->
    <rect x="336" y="16" width="44" height="24" rx="12" fill="#cf699b"/>
    <circle cx="368" cy="28" r="9" fill="white"/>
    
    <text x="20" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#938f99" fill-opacity="0.85">Pressing any key immediately cancels and disables gestures.</text>
  </g>

  <!-- 5. Excluded Domains Card -->
  <g transform="translate(40, 615)">
    <rect width="400" height="195" rx="20" fill="#211f26" stroke="#79747e" stroke-opacity="0.1" stroke-width="1"/>
    <text x="20" y="28" font-family="Outfit, Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e6e1e5">Excluded Domains</text>
    
    <!-- Textarea Box -->
    <rect x="20" y="38" width="360" height="76" rx="10" fill="#1c1b1f"/>
    <!-- Clean, generic examples to protect user's privacy -->
    <text x="32" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#e6e1e5">remotedesktop.google.com, docs.google.com</text>
    
    <text x="20" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#938f99" fill-opacity="0.85">Comma-separated list of websites where gestures will be</text>
    <text x="20" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#938f99" fill-opacity="0.85">completely disabled (e.g., docs.google.com, remotedesktop.google.com).</text>
  </g>
</svg>
